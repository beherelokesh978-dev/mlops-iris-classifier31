name: MLOps CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build-and-lint:
    name: build-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install flake8 pytest pytest-cov

      - name: Compile Python files
        run: python -m compileall -q src tests

      - name: Lint source code
        run: |
          python -m flake8 src/ \
            --max-line-length=100 \
            --extend-ignore=E203 \
            --statistics

  test-suite:
    name: test-suite
    needs: build-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov

      - name: Collect Iris data
        run: python src/pipeline/collect.py

      - name: Preprocess Iris data
        run: python src/pipeline/preprocess.py

      - name: Engineer features
        run: python src/pipeline/features.py

      - name: Run complete test suite
        run: |
          python -m pytest tests/ -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=test-results.xml

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            test-results.xml
            coverage.xml
          if-no-files-found: warn

  model-quality-gate:
    name: model-quality-gate
    needs: test-suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Collect Iris data
        run: python src/pipeline/collect.py

      - name: Preprocess Iris data
        run: python src/pipeline/preprocess.py

      - name: Engineer features
        run: python src/pipeline/features.py

      - name: Validate model quality
        run: python -m pytest tests/test_model_quality.py -v

  docker-container-check:
    name: docker-container-check
    needs: model-quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build container image
        run: |
          set -o pipefail
          docker build --progress=plain -t iris-classifier:v1 . 2>&1 | tee docker-build-first.log

      - name: Report image size
        run: docker images iris-classifier:v1

      - name: Start container
        run: docker run -d --name iris-classifier-container -p 8000:8000 iris-classifier:v1

      - name: Verify container health
        run: |
          for attempt in $(seq 1 20); do
            status="$(docker inspect --format='{{.State.Health.Status}}' iris-classifier-container)"
            echo "Container health: ${status}"
            if [ "${status}" = "healthy" ]; then
              exit 0
            fi
            if [ "${status}" = "unhealthy" ]; then
              docker logs iris-classifier-container
              exit 1
            fi
            sleep 2
          done
          docker logs iris-classifier-container
          echo "Container did not become healthy within 40 seconds."
          exit 1

      - name: Verify health endpoint
        run: |
          response="$(curl --fail --silent --show-error --write-out '\n%{http_code}' http://localhost:8000/health)"
          echo "${response}"
          test "$(printf '%s\n' "${response}" | tail -n 1)" = "200"
          printf '%s\n' "${response}" | head -n 1 | python -c "import json,sys; assert json.load(sys.stdin) == {'status': 'healthy'}"

      - name: Verify valid and invalid prediction requests
        run: |
          python - <<'PY'
          import json
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          base_url = "http://localhost:8000"
          valid_payload = {
              "sepal length (cm)": 5.1,
              "sepal width (cm)": 3.5,
              "petal length (cm)": 1.4,
              "petal width (cm)": 0.2,
              "sepal_area": 17.85,
              "petal_area": 0.28,
              "sepal_to_petal_length_ratio": 3.642857,
          }
          request = Request(
              f"{base_url}/predict",
              data=json.dumps(valid_payload).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urlopen(request, timeout=5) as response:
              prediction = json.load(response)
          assert prediction["prediction"] in {"setosa", "versicolor", "virginica"}
          probabilities = prediction["probabilities"]
          assert len(probabilities) == 3
          assert abs(sum(probabilities) - 1.0) < 1e-6
          print(f"Valid prediction: {prediction}")

          request = Request(
              f"{base_url}/predict",
              data=json.dumps({"sepal length (cm)": 5.1}).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              urlopen(request, timeout=5)
          except HTTPError as error:
              assert error.code == 400
              result = json.load(error)
              assert result["error"] == "Missing features"
              assert "petal length (cm)" in result["missing"]
              print(f"Invalid request: HTTP {error.code}, {result}")
          else:
              raise AssertionError("Missing features were not rejected.")
          PY

      - name: Verify service logs
        run: |
          docker logs iris-classifier-container 2>&1 | tee docker-container.log
          grep -q "Serving model on http://0.0.0.0:8000" docker-container.log
          grep -q "GET /health" docker-container.log
          grep -q "POST /predict" docker-container.log

      - name: Verify Docker layer cache
        run: |
          set -o pipefail
          docker build --progress=plain -t iris-classifier:v1 . 2>&1 | tee docker-build-second.log
          grep -q "CACHED" docker-build-second.log

      - name: Stop and remove container
        if: always()
        run: |
          docker stop iris-classifier-container || true
          docker rm iris-classifier-container || true
